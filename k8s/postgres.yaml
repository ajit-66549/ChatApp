apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres

spec:
  serviceName: db
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: chatapp

            - name: POSTGRES_USER
              value: chatapp

            - name: POSTGRES_PASSWORD
              value: chatapp

            # Point PGDATA to a subdirectory so Postgres doesn't complain
            # about the lost+found dir that Kubernetes creates in mounted volumes.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  # Kubernetes automatically creates and binds a PVC for each pod.
  # When the pod is deleted/recreated, the same PVC is re-attached
  # and all existing data is transparently restored.
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---

apiVersion: v1
kind: Service

metadata:
  name: db

spec:
  # ClusterIP (default) is correct — only internal pods need to reach Postgres.
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432