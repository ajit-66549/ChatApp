apiVersion: apps/v1
kind: Deployment

metadata:
  name: celery-worker

spec:
  replicas: 1

  selector:
    matchLabels:
      app: celery-worker

  template:
    metadata:
      labels:
        app: celery-worker

    spec:
      containers:
        - name: celery-worker
          image: chatapp-backend:latest
          imagePullPolicy: Never

          command:
            - celery
            - -A
            - messaging.worker.celery_app
            - worker
            - --loglevel=info

          env:
            - name: DB_HOST
              value: db

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: chatapp

            - name: DB_USER
              value: chatapp

            - name: DB_PASSWORD
              value: chatapp

            - name: REDIS_URL
              value: redis://redis:6379/0

            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0

            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0

            - name: MESSAGE_QUEUE_KEY
              value: chatapp:messages

            - name: MESSAGE_BATCH_SIZE
              value: "50"

            - name: MESSAGE_FLUSH_SECONDS
              value: "5.0"

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: celery-beat

spec:
  replicas: 1

  selector:
    matchLabels:
      app: celery-beat

  template:
    metadata:
      labels:
        app: celery-beat

    spec:
      containers:
        - name: celery-beat
          image: chatapp-backend:latest
          imagePullPolicy: Never

          command:
            - celery
            - -A
            - messaging.worker.celery_app
            - beat
            - --loglevel=info

          env:
            - name: REDIS_URL
              value: redis://redis:6379/0

            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0

            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0

            - name: MESSAGE_FLUSH_SECONDS
              value: "5.0"
